<!--
  The real app sets `html,body{height:100%;overflow:hidden}` in index.css so the
  chat scrolls inside its own container. That rule breaks scrolling inside the
  Storybook preview iframe (stories that are taller than the viewport get clipped).
  Restore normal document scrolling here.
-->
<style>
  html, body {
    height: auto !important;
    min-height: 100%;
    overflow: auto !important;
  }
  #storybook-root {
    min-height: 100%;
  }
</style>
